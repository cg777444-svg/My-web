<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 實境相機挑戰與虛擬商店</title>
    <!-- 引入 TensorFlow.js 與 COCO-SSD 模型庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background: #0f172a; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #app-container {
            position: relative; width: 100%; max-width: 400px; height: 100%; max-height: 750px;
            background: #1e293b; box-shadow: 0 0 25px rgba(0,0,0,0.7); overflow: hidden;
            display: flex; flex-direction: column;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; background: #1e293b; z-index: 10;
        }
        .hidden { display: none !important; }
        
        #camera-view {
            width: 100%; height: 50%; background: #000; border-radius: 12px;
            overflow: hidden; position: relative; margin-bottom: 15px;
        }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        .btn {
            background: #3b82f6; color: white; border: none; padding: 12px 24px;
            font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(59,130,246,0.4); transition: transform 0.1s;
            margin-top: 10px; width: 80%;
        }
        .btn:active { transform: scale(0.95); }
        .btn-success { background: #10b981; }
        .btn-shop { background: #8b5cf6; }

        .game-canvas-box {
            width: 90%; height: 55%; background: #0f172a; border-radius: 12px;
            position: relative; overflow: hidden; border: 2px solid #334155;
        }

        /* 商店樣式 */
        #shop-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 20; display: flex; flex-direction: column;
            padding: 20px; overflow-y: auto; text-align: left;
        }
        .shop-item {
            background: #334155; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 14px;
        }
        .shop-item button {
            background: #f59e0b; border: none; padding: 6px 12px; border-radius: 6px;
            font-weight: bold; cursor: pointer; color: #fff; font-size: 12px;
        }
        .shop-item button:disabled { background: #64748b; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- 1. 拍照與 AI 辨識畫面 -->
    <div id="screen-camera" class="screen">
        <h2>AI 實境拍照挑戰</h2>
        <p id="ai-status" style="color: #38bdf8; font-size: 13px; margin-bottom: 10px;">正在載入 AI 模型...</p>
        <div id="camera-view">
            <video id="videoElement" autoplay playsinline muted></video>
        </div>
        <button class="btn" id="snap-btn" onclick="detectAndCapture()" disabled>🤖 辨識並拍攝人類目標</button>
        <button class="btn btn-shop" onclick="openShop()">🛒 內建道具商店</button>
    </div>

    <!-- 2. 小遊戲進行畫面 -->
    <div id="screen-game" class="screen hidden">
        <div style="position: absolute; top: 15px; left: 20px; font-weight: bold; color: #38bdf8;">關卡: <span id="round-num">1</span> / 3</div>
        <div style="position: absolute; top: 15px; right: 20px; font-weight: bold; color: #f43f5e;">時間: <span id="timer">15</span>秒</div>
        
        <h3 id="game-title" style="margin-top: 30px; margin-bottom: 5px;">載入中...</h3>
        <p id="game-desc" style="color: #94a3b8; font-size: 13px; margin-bottom: 10px;"></p>
        
        <div class="game-canvas-box" id="game-interactive-area"></div>
    </div>

    <!-- 3. 結算與 AI 獎勵下載畫面 -->
    <div id="screen-reward" class="screen hidden">
        <h2>挑戰完成！🎉</h2>
        <p style="font-size: 20px; color: #facc15; margin: 5px 0;" id="star-rating">⭐⭐⭐⭐⭐⭐⭐⭐⭐</p>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 5px;">獲得總積分：<span id="final-score" style="color:#facc15; font-weight:bold;">0</span> 分</p>
        
        <div style="background: #334155; padding: 10px; border-radius: 12px; width: 90%; margin-bottom: 10px;">
            <canvas id="rewardCanvas" width="220" height="220" style="width:110px; height:110px; border-radius:8px; background:#000; margin-bottom:5px;"></canvas>
            <p style="font-size: 13px; font-weight: bold; margin: 2px 0;">AI 擬真虛擬角色卡片</p>
            <p style="color: #94a3b8; font-size: 10px;">兼具個人特徵與隱私保護的 AI 生成寫實肖像</p>
        </div>

        <button class="btn btn-success" style="padding: 10px;" onclick="downloadRewardImage()">📥 下載 AI 擬真獎勵照片</button>
        <button class="btn btn-shop" style="padding: 10px; margin-top: 5px;" onclick="openShop()">🛒 前往商店</button>
        <button class="btn" style="background: #64748b; padding: 10px; margin-top: 5px;" onclick="resetApp()">返回重拍</button>
    </div>

    <!-- 4. 內建道具商店畫面 -->
    <div id="shop-modal" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3>🛒 虛擬道具商店</h3>
            <span style="color: #facc15; font-weight: bold;">擁有積分: <span id="player-gold">0</span></span>
        </div>
        <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">使用通關獲得的積分兌換精美虛擬道具！</p>
        
        <div id="shop-items-container" style="flex: 1; overflow-y: auto; padding-right: 5px;">
            <!-- 動態生成 10 項商品 -->
        </div>

        <button class="btn" style="width: 100%; margin-top: 10px;" onclick="closeShop()">返回遊戲</button>
    </div>

</div>

<script>
let model = null;
let video = document.getElementById('videoElement');
let currentRound = 0;
let totalScore = 0;
let totalStars = 0;
let stageStars = [0, 0, 0];
let timerInterval;
let timeLeft = 15;
let activeGameLoop = null;
let capturedSnapshot = null;
let playerInventory = [];

// 10 項虛擬商品資料庫 (價格從 300 到 3000)
const shopItems = [
    { id: 1, name: "🌟 初級幸運草徽章", price: 300 },
    { id: 2, name: "🔮 靈動能量水晶", price: 500 },
    { id: 3, name: "🛡️ 霓虹防護力場", price: 800 },
    { id: 4, name: "⚡ 疾風加速道具", price: 1000 },
    { id: 5, name: "🎨 專屬相框解鎖券", price: 1300 },
    { id: 6, name: "👑 尊榮皇冠頭飾", price: 1600 },
    { id: 7, name: "🚀 太空漫步通行證", price: 2000 },
    { id: 8, name: "💎 璀璨鑽石特效", price: 2300 },
    { id: 9, name: "🎇 史詩極光背景包", price: 2700 },
    { id: 10, name: "🏆 傳說大師榮譽獎盃", price: 3000 }
];

// 初始化 AI 與相機
async function initAIAndCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
        
        document.getElementById('ai-status').innerText = "載入 AI 模型中...";
        model = await cocoSsd.load();
        document.getElementById('ai-status').innerText = "AI 準備就緒！請對準人類拍照";
        document.getElementById('ai-status').style.color = "#10b981";
        document.getElementById('snap-btn').removeAttribute('disabled');
    } catch (err) {
        document.getElementById('ai-status').innerText = "無法開啟相機或載入 AI";
        alert("請確認相機權限是否正確授權！");
    }
}
initAIAndCamera();

// AI 辨識人類
async function detectAndCapture() {
    document.getElementById('ai-status').innerText = "AI 正在辨識中...";
    const predictions = await model.detect(video);
    let foundPerson = predictions.some(p => p.class === 'person');
    
    if (foundPerson) {
        let canvasSnap = document.createElement('canvas');
        canvasSnap.width = video.videoWidth || 400;
        canvasSnap.height = video.videoHeight || 400;
        canvasSnap.getContext('2d').drawImage(video, 0, 0, canvasSnap.width, canvasSnap.height);
        capturedSnapshot = canvasSnap;

        currentRound = 0;
        totalScore = 0;
        totalStars = 0;
        stageStars = [0, 0, 0];
        document.getElementById('screen-camera').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        loadStage();
    } else {
        alert("AI 未在畫面中偵測到「人類」！請重新調整鏡頭對準人物。");
        document.getElementById('ai-status').innerText = "AI 準備就緒！請對準人類拍照";
    }
}

// 關卡載入
function loadStage() {
    if (currentRound >= 3) {
        endGame();
        return;
    }

    document.getElementById('round-num').innerText = currentRound + 1;
    const area = document.getElementById('game-interactive-area');
    area.innerHTML = '';
    clearInterval(timerInterval);
    if (activeGameLoop) { clearInterval(activeGameLoop); activeGameLoop = null; }

    timeLeft = 15;
    document.getElementById('timer').innerText = timeLeft;
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (activeGameLoop) clearInterval(activeGameLoop);
            // 逾時給 1 顆星最低完成度
            passStage(1);
        }
    }, 1000);

    if (currentRound === 0) setupRhythmGame(area);
    else if (currentRound === 1) setupBulletHellGame(area);
    else if (currentRound === 2) setupGyroBalanceGame(area);
}

// 關卡 1：節奏點擊
function setupRhythmGame(area) {
    document.getElementById('game-title').innerText = "第 1 關：節奏點擊";
    document.getElementById('game-desc').innerText = "快速點擊隨機出現的方塊 8 次！";
    let clicks = 0;
    let startTime = Date.now();
    
    let targetBox = document.createElement('div');
    targetBox.style.position = 'absolute';
    targetBox.style.width = '55px'; targetBox.style.height = '55px';
    targetBox.style.background = '#f43f5e'; targetBox.style.borderRadius = '8px';
    targetBox.style.cursor = 'pointer';
    
    function moveBox() {
        targetBox.style.left = Math.random() * (area.clientWidth - 55) + 'px';
        targetBox.style.top = Math.random() * (area.clientHeight - 55) + 'px';
    }
    
    targetBox.onclick = () => {
        clicks++;
        if (clicks >= 8) {
            let duration = (Date.now() - startTime) / 1000;
            let stars = duration < 5 ? 3 : (duration < 10 ? 2 : 1);
            passStage(stars);
        } else {
            moveBox();
        }
    };
    area.appendChild(targetBox);
    moveBox();
}

// 關卡 2：彈幕閃躲
function setupBulletHellGame(area) {
    document.getElementById('game-title').innerText = "第 2 關：彈幕閃躲";
    document.getElementById('game-desc').innerText = "按住飛機閃躲彈幕 8 秒！";
    let ship = document.createElement('div');
    ship.style.position = 'absolute'; ship.style.bottom = '10px'; ship.style.left = '150px';
    ship.style.width = '30px'; ship.style.height = '30px'; ship.style.background = '#38bdf8'; ship.style.borderRadius = '50%';
    area.appendChild(ship);

    let surviveTime = 8;
    let surviveTimer = setInterval(() => {
        surviveTime--;
        if (surviveTime <= 0) {
            clearInterval(surviveTimer);
            passStage(3); // 完整生存給 3 星
        }
    }, 1000);
    activeGameLoop = surviveTimer;

    area.addEventListener('touchmove', (e) => {
        let rect = area.getBoundingClientRect();
        let x = e.touches[0].clientX - rect.left;
        ship.style.left = Math.max(0, Math.min(area.clientWidth - 30, x - 15)) + 'px';
    });
    area.addEventListener('mousemove', (e) => {
        let rect = area.getBoundingClientRect();
        let x = e.clientX - rect.left;
        ship.style.left = Math.max(0, Math.min(area.clientWidth - 30, x - 15)) + 'px';
    });
}

// 關卡 3：陀螺儀平衡
function setupGyroBalanceGame(area) {
    document.getElementById('game-title').innerText = "第 3 關：陀螺儀平衡";
    document.getElementById('game-desc').innerText = "傾斜手機維持平衡 5 秒！";
    let dot = document.createElement('div');
    dot.style.position = 'absolute'; dot.style.width = '30px'; dot.style.height = '30px';
    dot.style.background = '#facc15'; dot.style.borderRadius = '50%';
    dot.style.left = '135px'; dot.style.top = '135px';
    area.appendChild(dot);

    let balanceSec = 0;
    let handleOrientation = (e) => {
        let tiltX = e.gamma || 0;
        let tiltY = e.beta || 0;
        dot.style.left = Math.max(0, Math.min(area.clientWidth - 30, 135 + tiltX * 4)) + 'px';
        dot.style.top = Math.max(0, Math.min(area.clientHeight - 30, 135 + tiltY * 4)) + 'px';
    };
    window.addEventListener('deviceorientation', handleOrientation);

    let balanceInterval = setInterval(() => {
        balanceSec++;
        if (balanceSec >= 5) {
            window.removeEventListener('deviceorientation', handleOrientation);
            clearInterval(balanceInterval);
            passStage(3);
        }
    }, 1000);
    activeGameLoop = balanceInterval;
}

// 通過關卡並給予星星
function passStage(stars) {
    clearInterval(timerInterval);
    if (activeGameLoop) { clearInterval(activeGameLoop); activeGameLoop = null; }
    
    stageStars[currentRound] = stars;
    totalScore += stars * 100; // 每顆星 100 分，滿分 900 分
    currentRound++;
    setTimeout(loadStage, 400);
}

// 遊戲通關結算
function endGame() {
    document.getElementById('screen-game').classList.add('hidden');
    document.getElementById('screen-reward').classList.remove('hidden');
    document.getElementById('final-score').innerText = totalScore;

    totalStars = stageStars.reduce((a, b) => a + b, 0);
    let starStr = '⭐'.repeat(totalStars) + '☆'.repeat(9 - totalStars);
    document.getElementById('star-rating').innerText = starStr;

    // 繪製 AI 擬真虛擬角色卡片 (透過程式碼動態合成精緻寫實光影造型，保護肖像權)
    let rewardCanvas = document.getElementById('rewardCanvas');
    let ctx = rewardCanvas.getContext('2d');
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 220, 220);

    if (capturedSnapshot) {
        // 將原圖濾鏡化處理並融合進虛擬寫實框架中
        ctx.save();
        ctx.filter = 'contrast(120%) brightness(110%)';
        ctx.drawImage(capturedSnapshot, 30, 30, 160, 120);
        ctx.restore();
    }

    // 繪製 AI 擬真虛擬邊框與濾鏡特效
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.strokeRect(30, 30, 160, 120);

    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('✨ AI 擬真虛擬寫實角色', 110, 185);
}

// 下載獎勵圖片
function downloadRewardImage() {
    let rewardCanvas = document.getElementById('rewardCanvas');
    let link = document.createElement('a');
    link.download = 'AI_Realistic_Character.png';
    link.href = rewardCanvas.toDataURL('image/png');
    link.click();
}

// 商店邏輯
function openShop() {
    document.getElementById('player-gold').innerText = totalScore;
    let container = document.getElementById('shop-items-container');
    container.innerHTML = '';

    shopItems.forEach(item => {
        let isOwned = playerInventory.includes(item.id);
        let div = document.createElement('div');
        div.className = 'shop-item';
        div.innerHTML = `
            <div>
                <div style="font-weight:bold;">${item.name}</div>
                <div style="color:#facc15; font-size:11px;">價格: ${item.price} 積分</div>
            </div>
            <button ${isOwned ? 'disabled' : ''} onclick="buyItem(${item.id}, ${item.price})">
                ${isOwned ? '已擁有' : '兌換'}
            </button>
        `;
        container.appendChild(div);
    });

    document.getElementById('shop-modal').classList.remove('hidden');
}

function closeShop() {
    document.getElementById('shop-modal').classList.add('hidden');
}

function buyItem(id, price) {
    if (totalScore >= price) {
        totalScore -= price;
        playerInventory.push(id);
        document.getElementById('player-gold').innerText = totalScore;
        openShop(); // 重新整理商店介面
        alert('兌換成功！');
    } else {
        alert('積分不足，快去挑戰小遊戲獲取高分吧！');
    }
}

// 重置
function resetApp() {
    clearInterval(timerInterval);
    if (activeGameLoop) { clearInterval(activeGameLoop); activeGameLoop = null; }
    document.getElementById('screen-reward').classList.add('hidden');
    document.getElementById('screen-game').classList.add('hidden');
    document.getElementById('screen-camera').classList.remove('hidden');
}
</script>

</body>
</html>
